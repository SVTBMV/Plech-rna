<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Plechárna – idle hra</title>
<style>
:root{--bg:#12161b;--panel:#1b2128;--panel2:#232b34;--line:#2f3945;--tx:#e8edf2;--mut:#8b98a6;--acc:#ff9f1c;--acc2:#ffbf69;--ok:#4cc38a;--bad:#ef5b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
#app{min-height:100dvh;display:flex}
#col{flex:1;min-width:0;max-width:1320px;margin:0 auto;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.money{font-size:1.35rem;font-weight:700;color:var(--acc)}
.sub{font-size:.8rem;color:var(--mut)}
.rep{font-size:1.1rem;font-weight:600;text-align:right}
main{flex:1;padding:12px 14px 30px}
nav{position:sticky;top:0;align-self:flex-start;height:100dvh;width:72px;flex:none;z-index:6;background:var(--panel);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);overflow-y:auto}
nav .in{display:flex;flex-direction:column}
nav button{background:none;border:0;border-left:3px solid transparent;padding:14px 2px 12px;font-size:.66rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:manipulation;cursor:pointer;width:100%}
nav button span{font-size:1.4rem}
nav button.on{color:var(--acc);border-left-color:var(--acc);background:var(--panel2)}
@media(min-width:700px){
  nav{width:150px}
  nav button{flex-direction:row;gap:10px;justify-content:flex-start;padding:14px 14px;font-size:.92rem}
  nav button span{font-size:1.25rem}
}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
#view>*{min-width:0}
#view>.card{margin-bottom:0;height:100%}
#view>h2.sec{grid-column:1/-1;margin:10px 2px 0}
#view>h2.sec:first-child{margin-top:0}
#view>.hint,#view>.empty,#view>.wide{grid-column:1/-1}
#view>.hint{margin:0 2px}
@media(min-width:760px){#view{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){#view{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:760px){main{padding:16px 20px 40px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.ok{border-color:var(--ok);background:#14251f}
.card.sub{border-style:dashed;border-color:var(--bad);margin-left:14px}
.card h3{margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:.82rem;color:var(--mut)}
.row.small{margin-top:8px;flex-wrap:wrap}
.row.small b{color:var(--tx)}
.tag{background:var(--panel2);border-radius:20px;padding:2px 10px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.78rem;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:2px 9px}
.chip.cur{border-color:var(--acc);color:var(--acc)}
.chip.done{background:#173326;border-color:#244f3a;color:var(--ok)}
.bar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.btn{background:var(--acc);color:#1a1205;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:44px}
.btn:disabled{background:var(--panel2);color:var(--mut);cursor:not-allowed}
.btn.full{width:100%;margin-top:10px}
.btn.ghost{background:var(--panel2);color:var(--tx)}
.btn.danger{background:#3a1f22;color:#ff9a9a}
.btn.work{width:100%;margin-top:10px;font-size:1.05rem;padding:14px}
.hint{font-size:.88rem;color:var(--mut);margin:0 2px 10px}
.hint b{color:var(--tx)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
h2.sec{font-size:.95rem;margin:16px 2px 8px;color:var(--acc2)}
.slim{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slim .btn{min-width:110px}
textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.75rem}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px}
#start{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:20px 14px 40px}
#start[hidden]{display:none}
.start-box{max-width:560px;margin:0 auto}
.start-box h1{margin:6px 0}
.pick{display:block;width:100%;text-align:left;cursor:pointer}
.pick:hover{border-color:var(--acc)}
.pick b{display:block;font-size:1.05rem}
.pick span{display:block;color:var(--mut);font-size:.88rem;margin:3px 0}
.pick em{display:block;font-style:normal;color:var(--acc2);font-size:.85rem}
#toast{position:fixed;left:0;right:0;top:70px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toast div{background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;font-size:.9rem;max-width:92%;box-shadow:0 4px 14px #0008}
#toast div.bad{border-color:var(--bad)}
.pick:disabled{opacity:.45;cursor:not-allowed}
#modal{position:fixed;inset:0;z-index:25;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:440px;width:100%;max-height:92dvh;overflow:auto}
.mbox h3{margin:0 0 4px}
.mbox .opt{margin-top:6px}
.pick.sel{border-color:var(--acc);background:var(--panel2)}
button.chip{cursor:pointer;min-height:36px;touch-action:manipulation}
.btns{display:flex;flex-direction:column;gap:6px;min-width:110px}
.btns .btn{min-height:38px;padding:8px 12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.thumb{position:relative;width:60px;height:60px;flex:none;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.thumb img,.mt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hall{overflow:auto;background:#0e1318;border:1px solid var(--line);border-radius:10px;padding:6px;margin-top:8px;-webkit-overflow-scrolling:touch}
.hgrid{display:grid;grid-template-columns:repeat(var(--W),var(--c));grid-template-rows:repeat(var(--H),var(--c));width:calc(var(--W) * var(--c));
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--c) var(--c)}
.mt{position:relative;margin:1px;border-radius:6px;overflow:hidden;background:var(--panel2);border:2px solid #31404e;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}
.mt .emo{font-size:calc(var(--c) * 1.1)}
.mt .bdg{position:absolute;right:2px;bottom:2px;font-size:11px;background:#000b;border-radius:4px;padding:0 3px;line-height:1.3}
.mt.on{border-color:var(--ok)}.mt.off{border-color:var(--bad)}.mt.wh{border-color:#6c7a89;background:#2a2f36}
.mt.sel{outline:3px solid var(--acc);outline-offset:-1px;z-index:2}
.hgrid.edit{cursor:crosshair}.hgrid.edit .mt{cursor:grab}
.hgrid.hbg{background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),var(--bg);
  background-size:var(--c) var(--c),var(--c) var(--c),100% 100%,cover;background-position:0 0,0 0,0 0,center;border-radius:6px}
.hgrid.hbg .mt{background:rgba(20,26,32,.45);box-shadow:0 2px 8px #0008}
.hgrid.hbg .mt.wh{background:rgba(42,47,54,.7)}
.scene{position:relative;width:100%;margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#14110f center/cover no-repeat}
.scene svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene svg polygon{fill:transparent;stroke:none}
.scene svg polygon.sel{fill:rgba(255,159,28,.18);stroke:var(--acc);stroke-width:2;vector-effect:non-scaling-stroke}
.sm{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0}
.sm img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px #0009);pointer-events:none}
.sm .ph{display:flex;align-items:center;justify-content:center;aspect-ratio:1;width:100%;font-size:clamp(14px,3vw,34px);background:rgba(20,26,32,.55);border:2px solid #31404e;border-radius:8px;line-height:1}
.sm .bdg{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:12px;background:#000b;border-radius:6px;padding:0 4px;line-height:1.4}
.sm.idle .bdg{background:#7a1f1f}
.sm:hover img,.sm.sel img{filter:drop-shadow(0 0 8px var(--acc))}
.zoom{display:flex;gap:6px}.zoom .btn{min-height:34px;padding:4px 12px}
.est{font-size:.88rem;margin-top:8px;line-height:1.5}
label.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:.92rem;color:var(--tx)}
label.chk input{width:20px;height:20px;flex:none}
.mbox label.small{display:block;margin-top:10px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px;font:inherit;color:inherit}
.row.small.block{display:block;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <nav><div class="in" id="tabs"></div></nav>
  <div id="col">
    <header>
      <div><div class="money">💰 <span id="hMoney">0</span> Kč</div><div class="sub" id="hName"></div></div>
      <div class="rep">⭐ <span id="hRep">0</span><div class="sub">reputace</div></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="start" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ===================== DATA ===================== */
const SAVE_KEY = 'plecharna_save_v1';
const OFFLINE_CAP = 8 * 3600;           // max. offline postup (s)

const STEPS = {
  cut:    { name: 'Řezání',                  icon: '✂️' },
  bend:   { name: 'Ohýbání',                 icon: '📐' },
  roll:   { name: 'Stáčení',                 icon: '🔄' },
  weld:   { name: 'Svařování',               icon: '🔥' },
  fit:    { name: 'Zámečnické práce',        icon: '🔧' },   // vrtání, závitování, zahlubování
  grind:  { name: 'Broušení pohledové',      icon: '✨' },
  powder: { name: 'Práškové lakování',       icon: '🎨' },
  wet:    { name: 'Mokré lakování',          icon: '🖌️' },
  plate:  { name: 'Povrchové úpravy',        icon: '🧪' }    // pozink, elox ap.
};
Object.values(STEPS).forEach(st => { st.ind = 'metal'; });
Object.assign(STEPS, {                           // autoservis
  diag:   { name: 'Diagnostika',            icon: '🔍', ind: 'car' },
  wheels: { name: 'Pneuservis',             icon: '🛞', ind: 'car' },
  lube:   { name: 'Olej a kapaliny',         icon: '🛢️', ind: 'car' },
  brakes: { name: 'Brzdy a podvozek',        icon: '🛑', ind: 'car' },
  engine: { name: 'Motor a převodovka',      icon: '🔩', ind: 'car' },
  elec:   { name: 'Autoelektrika',           icon: '⚡', ind: 'car' },
  ac:     { name: 'Klimatizace',             icon: '❄️', ind: 'car' },
  detail: { name: 'Mytí a detailing',        icon: '🧽', ind: 'car' }
});
const INDUSTRIES = {
  metal: { name: 'Kovovýroba', icon: '🏭', desc: 'Výroba dílů z tenkých plechů.' },
  car:   { name: 'Autoservis', icon: '🚗', desc: 'Opravy a údržba osobních aut.' }
};
const STEP_ORDER = ['cut', 'bend', 'roll', 'weld', 'fit', 'grind', 'powder', 'wet', 'plate',
                    'diag', 'wheels', 'lube', 'brakes', 'engine', 'elec', 'ac', 'detail'];
const stepsOf = ind => STEP_ORDER.filter(st => STEPS[st].ind === ind);

const MACHINES = [
  { id: 'shear',       step: 'cut',    name: 'Tabulové nůžky',                 price: 120,   rate: 0.6 },
  { id: 'co2',         step: 'cut',    name: 'CO₂ laser',                      price: 1500,  rate: 3 },
  { id: 'fiber',       step: 'cut',    name: 'Vláknový laser',                 price: 12000, rate: 16 },
  { id: 'hand_bender', step: 'bend',   name: 'Ruční ohýbačka',                 price: 150,   rate: 0.6 },
  { id: 'press',       step: 'bend',   name: 'Hydraulický ohraňovací lis',     price: 2000,  rate: 3.5 },
  { id: 'cnc_press',   step: 'bend',   name: 'CNC ohraňovací lis',             price: 15000, rate: 18 },
  { id: 'hand_roll',   step: 'roll',   name: 'Ruční zakružovačka',             price: 140,   rate: 0.6 },
  { id: 'roll3',       step: 'roll',   name: 'Strojní zakružovačka (3 válce)', price: 2000,  rate: 3.3 },
  { id: 'cnc_roll',    step: 'roll',   name: 'CNC zakružovací stroj',          price: 15000, rate: 17 },
  { id: 'mig',         step: 'weld',   name: 'Svářečka MIG',                   price: 200,   rate: 0.5 },
  { id: 'spot',        step: 'weld',   name: 'Bodová svářečka',                price: 2500,  rate: 3 },
  { id: 'robot',       step: 'weld',   name: 'Svařovací robot',                price: 20000, rate: 17 },
  { id: 'drill',       step: 'fit',    name: 'Stolní vrtačka',                 price: 80,    rate: 0.5 },
  { id: 'drill_col',   step: 'fit',    name: 'Sloupová vrtačka se závitořezem',price: 1000,  rate: 2.6 },
  { id: 'tap_cnc',     step: 'fit',    name: 'Závitovací a vrtací centrum',    price: 11000, rate: 15 },
  { id: 'grind',       step: 'grind',  name: 'Ruční bruska',                   price: 100,   rate: 0.6 },
  { id: 'belt',        step: 'grind',  name: 'Pásová bruska',                  price: 1600,  rate: 3 },
  { id: 'brush_line',  step: 'grind',  name: 'Kartáčovací linka',              price: 13000, rate: 16 },
  { id: 'powder_hand', step: 'powder', name: 'Ruční pistole + pec',            price: 200,   rate: 0.6 },
  { id: 'powder_cab',  step: 'powder', name: 'Prášková kabina s pecí',         price: 2200,  rate: 3.2 },
  { id: 'powder',      step: 'powder', name: 'Automatická prášková lakovna',   price: 14000, rate: 17 },
  { id: 'spray',       step: 'wet',    name: 'Stříkací pistole',               price: 100,   rate: 0.6 },
  { id: 'paint',       step: 'wet',    name: 'Lakovací kabina',                price: 1800,  rate: 3.2 },
  { id: 'paintline',   step: 'wet',    name: 'Automatická lakovací linka',     price: 15000, rate: 17 },
  { id: 'galv_small',  step: 'plate',  name: 'Malá pozinkovací vana',          price: 250,   rate: 0.5 },
  { id: 'galv',        step: 'plate',  name: 'Galvanická linka (pozink)',      price: 3000,  rate: 3 },
  { id: 'anod',        step: 'plate',  name: 'Eloxovací linka',                price: 18000, rate: 16 }
];
MACHINES.push(                                    // autoservis: 3 třídy strojů v každé operaci
  { id: 'obd',          step: 'diag',   name: 'OBD čtečka a notebook',          price: 100,   rate: 0.6 },
  { id: 'tester',      step: 'diag',   name: 'Diagnostický tester',            price: 1800,  rate: 3.2 },
  { id: 'diag_line',   step: 'diag',   name: 'Diagnostická linka s měřením',   price: 14000, rate: 16 },
  { id: 'tire_hand',   step: 'wheels', name: 'Ruční montáž pneu',              price: 90,    rate: 0.5 },
  { id: 'tire_machine',step: 'wheels', name: 'Pneumontážní stroj',             price: 1500,  rate: 3 },
  { id: 'tire_line',   step: 'wheels', name: 'Automatická pneulinka',          price: 12000, rate: 16 },
  { id: 'jack',        step: 'lube',   name: 'Zvedák a olejová vana',          price: 120,   rate: 0.6 },
  { id: 'lift2',       step: 'lube',   name: 'Dvousloupový zvedák',            price: 2200,  rate: 3.3 },
  { id: 'lube_line',   step: 'lube',   name: 'Rychloservisní linka',           price: 14000, rate: 17 },
  { id: 'hand_tools',  step: 'brakes', name: 'Dílenské nářadí a stojany',      price: 150,   rate: 0.6 },
  { id: 'brake_bench', step: 'brakes', name: 'Brzdová stolice',                price: 2400,  rate: 3.2 },
  { id: 'align',       step: 'brakes', name: 'Geometrie a podvozková linka',   price: 16000, rate: 17 },
  { id: 'engine_hand', step: 'engine', name: 'Motorové nářadí a jeřáb',        price: 200,   rate: 0.5 },
  { id: 'engine_stand',step: 'engine', name: 'Motorový stojan s lisem',        price: 3000,  rate: 3 },
  { id: 'engine_cell', step: 'engine', name: 'Linka na generální opravy',      price: 20000, rate: 17 },
  { id: 'multimeter',  step: 'elec',   name: 'Multimetr a pájka',              price: 90,    rate: 0.5 },
  { id: 'scope',       step: 'elec',   name: 'Osciloskop a programátor ECU',   price: 2000,  rate: 2.8 },
  { id: 'ecu_lab',     step: 'elec',   name: 'Elektro-diagnostické pracoviště',price: 15000, rate: 16 },
  { id: 'ac_hand',     step: 'ac',     name: 'Ruční plnička klimatizací',      price: 140,   rate: 0.6 },
  { id: 'ac_station',  step: 'ac',     name: 'Servisní stanice klimatizací',   price: 2500,  rate: 3 },
  { id: 'ac_line',     step: 'ac',     name: 'Linka s recyklací chladiva',     price: 15000, rate: 16 },
  { id: 'wash_hand',   step: 'detail', name: 'Ruční mytí a leštění',           price: 60,    rate: 0.5 },
  { id: 'wash_box',    step: 'detail', name: 'Mycí box s lešticí stanicí',     price: 1400,  rate: 2.8 },
  { id: 'detail_line', step: 'detail', name: 'Detailingová linka',             price: 11000, rate: 15 }
);
const MACH = Object.fromEntries(MACHINES.map(m => [m.id, m]));

const STARTS = {
  klempir: {
    ind: 'metal', icon: '🔧', name: 'Klempířská dílna',
    desc: 'Malá rodinná dílna: řezání a ohýbání. Ostatní operace musíte zatím kooperovat.',
    money: 400, machines: { shear: 1, hand_bender: 1 }, worker: 'shear', techs: ['cut', 'bend'],
    perk: { mat: 0.9 }, perkText: 'Materiál o 10 % levnější'
  },
  domaci: {
    ind: 'metal', icon: '🏠', name: 'Domácí zámečnická dílna',
    desc: 'Vrtání, závitování a zahlubování na stolní vrtačce. Levný start, zpočátku drobné zakázky.',
    money: 350, machines: { drill: 1 }, worker: 'drill', techs: ['fit'],
    perk: { speed: { fit: 1.25 } }, perkText: 'Zámečnické práce o 25 % rychlejší'
  },
  laser: {
    ind: 'metal', icon: '🔦', name: 'Laserové řezání',
    desc: 'Jen řezání, ale s CO₂ laserem. Vše ostatní kooperujete.',
    money: 150, machines: { co2: 1 }, worker: 'co2', techs: ['cut'],
    perk: { speed: { cut: 1.25 } }, perkText: 'Řezání o 25 % rychlejší'
  },
  ohybarna: {
    ind: 'metal', icon: '📐', name: 'Ohýbárna',
    desc: 'Jen ohýbání, ale s hydraulickým lisem. Řezání, svařování i povrchovky kooperujete.',
    money: 250, machines: { press: 1 }, worker: 'press', techs: ['bend'],
    perk: { speed: { bend: 1.25 } }, perkText: 'Ohýbání o 25 % rychlejší'
  },
  automotive: {
    ind: 'metal', icon: '🚗', name: 'Subdodavatel pro automotive',
    desc: 'Svařovna pro automotive: jen svařování. Zákazníci vás rychle doporučí dál.',
    money: 200, machines: { mig: 1 }, worker: 'mig', techs: ['weld'],
    perk: { rep: 2 }, perkText: 'Reputace roste 2× rychleji'
  }
  ,
  pneu: {
    ind: 'car', icon: '🛞', name: 'Pneuservis',
    desc: 'Přezouvání a vyvažování. Levný start s ruční montáží pneu, ostatní operace kooperujete.',
    money: 200, machines: { tire_hand: 1 }, worker: 'tire_hand', techs: ['wheels'],
    perk: { speed: { wheels: 1.25 } }, perkText: 'Pneuservis o 25 % rychlejší'
  },
  detailing: {

/* ===================== KOOPERACE ===================== */
/* Kroky, na které nevlastníte stroj, zpracuje dodavatel. Variantu volíte při
   přijetí zakázky a cena se strhne z odměny až po dokončení (nepotřebujete kapitál).
   cost = podíl na zisku zakázky, t = násobek doby. */
const COOP = {
  fast: { icon: '🚀', name: 'Rychle – draze',          t: 0.35, c: 1.8 },
  norm: { icon: '🚚', name: 'Normálně – střední cena', t: 1,    c: 1 },
  slow: { icon: '🐢', name: 'Pomalu – levně',          t: 2,    c: 0.55 }
};
let planOid = null;      // zakázka na nabídce, u které právě volíte kooperace
let planSel = {};        // krok -> zvolená varianta

const orderMatBase = o => (o.matBase != null ? o.matBase : o.qty * PROD[o.pid].mat);
function coopQuote(o, optId) {
  const n = PROD[o.pid].steps.length;
  const profit = Math.max(10, o.reward - orderMatBase(o));
  const c = COOP[optId];
  return {
    cost: Math.max(5, Math.ceil(profit / n * 0.45 * c.c)),
    time: Math.round((15 + o.work * 1.5) * c.t)
  };
}
const needSteps = o => PROD[o.pid].steps.filter(s => stationCount(s) === 0);   // kroky bez obsazené stanice (stroj + člověk)
function planDefault(o) { const pl = {}; for (const s of needSteps(o)) pl[s] = 'norm'; return pl; }
function planTotal(o, plan) {
  let cost = 0, time = 0;
  for (const s of needSteps(o)) {
    if (plan[s] === 'self') continue;               // vlastními silami = zdarma
    const q = coopQuote(o, plan[s] || 'norm'); cost += q.cost; time += q.time;
  }
  return { cost, time };
}
const isPending = o => !o.coop && !o.done && !!o.steps[o.step] && stationCount(o.steps[o.step]) === 0 &&
  !(o.plan && o.plan[o.steps[o.step]] === 'self' && machineUnits(o.steps[o.step]) > 0);
function startCoop(o, optId) {
  const q = coopQuote(o, optId);
  const f = (o.cw || o.work) / o.work;           // při přepracování zmetků jen podíl
  const cost = Math.ceil(q.cost * f), time = Math.max(5, Math.round(q.time * f));
  o.coopCost = (o.coopCost || 0) + cost;         // strhne se z odměny při dokončení
  o.coop = { opt: optId, left: time, total: time };
}
function autoCoop() {            // zakázka došla ke kroku bez stroje -> použije se zvolený plán
  for (const o of G.active) {
    if (isPending(o)) startCoop(o, (o.plan && o.plan[o.steps[o.step]]) || 'norm');
  }
}
function openPlan(oid) {
  const o = G.orders.find(x => x.id == oid);
  if (!o) return;
  planOid = o.id; planSel = planDefault(o); buildModal();
}

}

    ${steps.map(s => `<div style="margin-top:12px"><b>${STEPS[s].icon} ${STEPS[s].name}</b>
      ${Object.entries(COOP).map(([id, c]) => {
        const q = coopQuote(o, id), on = planSel[s] === id;
        return `<button class="card pick opt${on ? ' sel' : ''}" data-act="plan" data-step="${s}" data-opt="${id}">
          <b>${on ? '●' : '○'} ${c.icon} ${c.name}</b><span>Doba ${fmtTime(q.time)}</span><em>−${fmt(q.cost)} Kč z odměny</em></button>`;
      }).join('')}
      ${machineUnits(s) > 0 ? `<button class="card pick opt${planSel[s] === 'self' ? ' sel' : ''}" data-act="plan" data-step="${s}" data-opt="self">
          <b>${planSel[s] === 'self' ? '●' : '○'} 🙋 Vlastními silami</b>

    <div class="est">Odměna <b>${fmt(o.reward)} Kč</b></div>

/* Pozadí plánu haly: první nalezený obrázek z tohoto seznamu (složka Grafika Stroje nebo vedle index.html). */
const HALL_BG_NAMES = ['Prazdna hala', 'Prázdná hala', 'Hala prazdna', 'Pozadi haly', 'Hala'];
/* Kam v obrázku prázdné haly padá podlaha: tři rohy podlahy jako podíl šířky/výšky obrázku
   (A = horní roh, B = pravý roh, D = levý roh). Čtvrtý roh se dopočítá. Když obrázek sedí jinak, stačí přepsat. */
const HALL_QUAD = { A: [0.53, 0.21], B: [0.98, 0.62], D: [0.01, 0.62] };
const SCENE_AR = 16 / 9;
let hallView = 'scene';                          // 'scene' = obrázek haly, 'grid' = mřížka
const KEYED = {}, KEYING = {};                   // id stroje -> obrázek s průhledným pozadím (nebo '' když nejde)
function ensureKeyed(m) {
  if (KEYED[m.id] !== undefined || KEYING[m.id]) return;
  KEYING[m.id] = true;
  const c = imgCandidates(m); let i = 0;
  const done = v => { KEYED[m.id] = v; delete KEYING[m.id]; if (G && curTab === 'company' && !gridEdit) renderView(true); };
  const next = () => {
    if (i >= c.length) return done('');
    const im = new Image(), u = c[i++];
    im.onerror = next;
    im.onload = () => {
      try {                                      // odstraní jednobarevné pozadí napojené na okraj obrázku
        const k = Math.min(1, 640 / im.naturalWidth), W = Math.round(im.naturalWidth * k), H = Math.round(im.naturalHeight * k);
        const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, W, H);
        const d = cx.getImageData(0, 0, W, H), px = d.data;
        const at = (x, y) => (y * W + x) * 4;
        const cs = [at(0, 0), at(W - 1, 0), at(0, H - 1), at(W - 1, H - 1)];
        if (cs.some(o => px[o + 3] < 250)) return done(u);          // už je průhledný
        const bg = [0, 1, 2].map(j => cs.reduce((a, o) => a + px[o + j], 0) / 4);
        if (cs.some(o => Math.abs(px[o] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o + 2] - bg[2]) > 60)) return done(u);   // pozadí není jednolité
        const near = o => Math.abs(px[o] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o + 2] - bg[2]) < 54;
        const seen = new Uint8Array(W * H), st = [];
        const push = (x, y) => { const q = y * W + x; if (!seen[q] && near(q * 4)) { seen[q] = 1; st.push(q); } };
        for (let x = 0; x < W; x++) { push(x, 0); push(x, H - 1); }
        for (let y = 0; y < H; y++) { push(0, y); push(W - 1, y); }
        while (st.length) {
          const q = st.pop(), x = q % W, y = (q / W) | 0;
          px[q * 4 + 3] = 0;
          if (x > 0) push(x - 1, y); if (x < W - 1) push(x + 1, y);
          if (y > 0) push(x, y - 1); if (y < H - 1) push(x, y + 1);
        }
        cx.putImageData(d, 0, 0);
        done(cv.toDataURL('image/png'));
      } catch (e) { done(u); }
    };
    im.src = u;
  };
  next();
}

})();

                            // velikost čtverečku (px) v plánu haly
function hallItems() {
  const items = [], w = WAREHOUSES[G.wh];
  const of = OFFICES[G.office];
  if (G.cs === 0 && of.area) items.push({ kind: 'of', key: 'of', w: of.w, h: of.h, area: of.area, ord: -2, idx: 0 });

  });
  return items.sort((a, b) => b.area - a.area || a.ord - b.ord || a.idx - b.idx);

/* Automatické rozmístění: největší kusy první, vše na sudých metrech, takže se vejde všechno,
   co se vejde plochou. */
function packHall(items, W, H, layout) {
  const occ = Array.from({ length: H }, () => new Array(W).fill(false));
  const free = (x, y, w, h) => {
    if (x < 0 || y < 0 || x + w > W || y + h > H) return false;
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (occ[j][i]) return false;
    return true;
  };
  const put = (it, pos) => {
    for (let j = pos.y; j < pos.y + pos.h; j++) for (let i = pos.x; i < pos.x + pos.w; i++) occ[j][i] = true;
    placed.push(Object.assign({}, it, pos));
  };
  const placed = [], failed = [], rest = [];
  for (const it of items) {                    // nejdřív kusy s ručně nastavenou polohou
    const L = layout && layout[it.key];
    const okDim = L && ((L.w === it.w && L.h === it.h) || (L.w === it.h && L.h === it.w));
    if (okDim && free(L.x, L.y, L.w, L.h)) put(it, { x: L.x, y: L.y, w: L.w, h: L.h });
    else rest.push(it);
  }
  for (const it of rest) {                     // ostatní automaticky, největší první, na sudých metrech
    let pos = null;
    const dims = it.w === it.h ? [[it.w, it.h]] : [[it.w, it.h], [it.h, it.w]];
    outer: for (const [w, h] of dims)
      for (let y = 0; y + h <= H; y += 2) for (let x = 0; x + w <= W; x += 2)
        if (free(x, y, w, h)) { pos = { x, y, w, h }; break outer; }
    if (!pos) { failed.push(it); continue; }
    put(it, pos);
  }
  return { placed, failed };
}
function unitWorker(m, idx) {                  // pracovník na dané kusu stroje (nejlepší dostanou první kusy)
  const ws = G.workers.filter(w => w.mid === m.id && (w.site || 0) === G.cs).sort((x, y) => workerFactor(y, m) - workerFactor(x, m));
  return ws[idx] || null;
}
function cellPx(hl) {
  return gridCell > 0 ? gridCell : Math.max(14, Math.min(44, Math.floor((view.clientWidth - 56) / hl.w)));
}
function sceneHtml(placed, hl) {
  const Q = HALL_QUAD;
  const P = (gx, gy) => ({ x: Q.A[0] + gx / hl.w * (Q.B[0] - Q.A[0]) + gy / hl.h * (Q.D[0] - Q.A[0]),
                           y: Q.A[1] + gx / hl.w * (Q.B[1] - Q.A[1]) + gy / hl.h * (Q.D[1] - Q.A[1]) });
  const pt = p => `${(p.x * 100).toFixed(2)},${(p.y * 100).toFixed(2)}`;
  const poly = (x, y, w, h) => [P(x, y), P(x + w, y), P(x + w, y + h), P(x, y + h)].map(pt).join(' ');

const perk = () => START.perk;

const defectMult = () => G.staff.technologist ? TECH_DEFECT[G.staff.technologist.tier] : 1;
const staffWagePerSec = () => STAFF_ORDER.reduce((n, r) => n + (G.staff[r] ? STAFF_PAY[G.staff[r].tier].wage : 0), 0);
const siteBonus = (site, step) => site.id === 0 ? ((perk().speed && perk().speed[step]) || 1) : (site.spec === step ? SITE_BONUS : 1);
const speedMult = (step, site) => (1 + 0.1 * (G.upg.eff || 0)) * (1 + techSpeedBonus() + storeBonus()) * siteBonus(site || G.sites[G.cs], step);

function stationList(step) {
  const out = [];
  for (const site of G.sites) {
    if (!site.techs[step]) continue;
    const sm = speedMult(step, site);
    for (const m of MACHINES) {
      if (m.step !== step) continue;
      const units = site.machines[m.id] || 0;
      if (!units) continue;
      const ws = G.workers.filter(w => w.mid === m.id && (w.site || 0) === site.id)
        .sort((x, y) => workerFactor(y, m) - workerFactor(x, m)).slice(0, units);
      for (const w of ws) out.push({ rate: m.rate * sm * workerFactor(w, m), wage: WORKER[w.tier].wage, defect: DEFECT_BASE[m.tier] * WQ[w.tier] });
    }
  }
  return out.sort((x, y) => y.rate - x.rate);
}

const freeSlots = (mid, exceptId, si) => { si = si == null ? G.cs : si; return (G.sites[si].machines[mid] || 0) - assignedTo(mid, exceptId, si); };

function genOrder() {
  const inds = new Set(G.sites.map(x => x.ind));
  const avail = PRODUCTS.filter(p => p.rep <= G.rep && inds.has(p.ind));
  // vyšší tiery mají o něco větší šanci
  const weights = avail.map((p, i) => {
    const own = p.steps.filter(st => hasTech(st)).length / p.steps.length;   // podíl vlastních operací
    return (1 + i * 0.15) * (0.3 + 2.7 * own);
  });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), idx = 0;
  for (; idx < weights.length - 1; idx++) { r -= weights[idx]; if (r <= 0) break; }
  const p = avail[idx];
  const qty = Math.round(rand(p.q[0], p.q[1]));
  const work = qty * p.work;
  const totalWork = work * p.steps.length;
  return {
    id: G.nextOrderId++, pid: p.id, qty, work,
    matBase: qty * p.mat,
    reward: Math.round(qty * p.price * rand(0.9, 1.15)),
    deadline: Math.round(90 + totalWork * 4)
  };
}
function fillBoard() { while (G.orders.length < boardSize()) G.orders.push(genOrder()); }
function spawnOrder() {
  G.orders.push(genOrder());
  while (G.orders.length > boardSize()) G.orders.shift();
}
const canPayMaterial = c => G.money + G.stock >= c;
function payMaterial(c) { const u = Math.min(G.stock, c); G.stock -= u; G.money -= (c - u); }   // nejdřív ze zásoby

/* Odhad nákladů a zisku zakázky při bezchybné výrobě (bez zmetků). */
function evalOrder(o, plan) {
  const p = PROD[o.pid];
  plan = plan || planDefault(o);
  const mat = orderCost(o);
  let coop = 0, wage = 0, time = 0, ok = 1;
  for (const st of p.steps) {
    const sts = stationList(st);
    if (sts.length) {                                   // vlastní stanice (nejrychlejší)
      const t = o.work / sts[0].rate;
      time += t; wage += t * sts[0].wage; ok *= 1 - Math.min(0.06, sts[0].defect * defectMult());
    } else if (plan[st] === 'self') {
      time += o.work / Math.max(1, clickPower()); ok *= 1 - DEFECT_BASE[0] * defectMult();
    } else {
      const opt = plan[st] || 'norm', q = coopQuote(o, opt);
      coop += q.cost; time += q.time; ok *= 1 - Math.min(0.06, COOP_DEFECT[opt] * defectMult());
    }
  }
  const over = staffWagePerSec() * time / (mainCount() + 1);
  const cost = mat + coop + wage + over;
  return { mat, coop, wage, over, time, cost, profit: o.reward - cost, risk: 1 - ok };
}
function estHtml(o, plan) {
  const ev = evalOrder(o, plan);
  const pc = o.reward > 0 ? Math.round(ev.profit / o.reward * 100) : 0;
  const parts = [`materiál ${fmt(ev.mat)}`];
  if (ev.coop) parts.push(`kooperace ${fmt(ev.coop)}`);
  if (ev.wage >= 1) parts.push(`mzdy ${fmt(ev.wage)}`);
  if (ev.over >= 1) parts.push(`režie ${fmt(ev.over)}`);
  return `<div>Náklady <b>${fmt(ev.cost)} Kč</b> <span class="small">(${parts.join(' · ')})</span></div>
    <div>Zisk při bezchybné výrobě: <b class="${ev.profit >= 0 ? 'pos' : 'neg'}">${ev.profit >= 0 ? '+' : '−'}${fmt(Math.abs(ev.profit))} Kč</b> (${pc} %)</div>
    <div class="small">Výroba asi ${fmtTime(ev.time)}${ev.time > o.deadline ? ' <span class="neg">⚠ nestihnete termín</span>' : ''} · riziko zmetku asi ${(ev.risk * 100).toFixed(1)} % kusů</div>`;
}

const mainCount = () => G.active.filter(x => !x.sub).length;     // podzakázky (přepracování) nezabírají místo v dílně
function acceptOrder(o, plan) {
  if (mainCount() >= slots()) return false;
  const c = orderCost(o);
  if (!canPayMaterial(c)) return false;           // předem se platí jen materiál (ze zásoby, pak z peněz)
  payMaterial(c);
  G.orders = G.orders.filter(x => x !== o);
  const p = PROD[o.pid];
  G.active.push({ id: o.id, pid: o.pid, qty: o.qty, work: o.work, cw: o.work, pieces: o.qty, redoTo: -1,
                  reward: o.reward, matBase: o.matBase,
                  left: o.deadline, steps: p.steps, step: 0, prog: 0, done: false,
                  coop: null, coopCost: 0, wageCost: 0, scrap: 0, scrapCost: 0, plan: plan || planDefault(o) });
  return true;
}
function finishOrder(o) {
  G.active = G.active.filter(x => x !== o);
  const cc = o.coopCost || 0, wc = o.wageCost || 0, sc = o.scrapCost || 0;
  const net = Math.max(0, o.reward - cc - wc - sc);   // kooperace, mzdy a zmetky se strhávají z odměny
  G.money += net;
  G.totalEarned += net;
  G.done++;
  G.rep += PROD[o.pid].g * (perk().rep || 1);
  const bits = [];
  if (cc) bits.push(`kooperace −${fmt(cc)}`);
  if (wc >= 1) bits.push(`mzdy −${fmt(wc)}`);
  if (sc) bits.push(`zmetky −${fmt(sc)}`);
  toast(`✅ ${PROD[o.pid].name} ×${o.qty} hotovo: +${fmt(net)} Kč` + (bits.length ? ` (${bits.join(', ')})` : ''));
}
function failOrder(o) {
  G.active = G.active.filter(x => x !== o && x.parent !== o.id);
  G.failed++;
  G.rep = Math.max(0, G.rep - 3);
  toast(`⏰ Zakázka ${PROD[o.pid].name} propadla (−3 reputace)`, true);
}

/* Dokončení operace: s malou šancí se některé kusy nepovedou. Zmetky se musí projít
   znovu všemi dosavadními operacemi a prodraží se o nový materiál. */
function rollDefects(pieces, p) { let d = 0; for (let i = 0; i < pieces; i++) if (Math.random() < p) d++; return d; }
function finishStep(o, base) {
  o.prog = 0;
  const k = o.step;
  if (o.sub) {                                       // podzakázka na přepracování: znovu se zmetky nehlídají
    o.step = k + 1;
    if (o.step >= o.steps.length) o.done = true;
    return;
  }
  if (o.redoTo >= 0) {                               // starší uložená hra: původní opravná smyčka
    if (k >= o.redoTo) { o.redoTo = -1; o.cw = o.work; o.pieces = o.qty; }
  } else {
    const d = rollDefects(o.pieces, Math.min(0.06, base * defectMult()));
    if (d > 0) spawnRework(o, d, k);
  }
  o.step = k + 1;
  if (o.pieces <= 0) o.step = o.steps.length;       // všechny kusy dopadly špatně, hlavní linka je u konce
  if (o.step >= o.steps.length) { o.lineDone = true; if (!o.subs) o.done = true; }
}
/* Zmetky vytvoří podzakázku: nový materiál a všechny operace od začátku až po tu, kde se to pokazilo.
   Hlavní zakázka jede dál s dobrými kusy a na konci čeká, až se podzakázka dokončí. */
function spawnRework(o, d, k) {
  const cost = Math.ceil(d * (o.matBase / o.qty) * matMult());
  o.scrap += d; o.scrapCost += cost; G.scrapped += d;
  o.pieces -= d;
  o.cw = Math.max(0.5, o.work * Math.max(0, o.pieces) / o.qty);
  o.subs = (o.subs || 0) + 1;
  const f = d / o.qty;
  G.active.push({ id: G.nextOrderId++, sub: true, parent: o.id, pid: o.pid, qty: d, pieces: d, redoTo: -1,
                  work: o.work * f, cw: Math.max(0.5, o.work * f), reward: Math.round(o.reward * f), matBase: o.matBase * f,
                  left: o.left, steps: o.steps.slice(0, k + 1), step: 0, prog: 0, done: false,
                  coop: null, coopCost: 0, wageCost: 0, scrap: 0, scrapCost: 0, plan: o.plan });
  if (quiet) return;
  const who = G.workers.length ? G.workers[Math.floor(Math.random() * G.workers.length)].name : 'Někdo';
  const st = o.steps[k], pool = jokePool(st);
  const line = pool[Math.floor(Math.random() * pool.length)].replace(/\{who\}/g, who).replace(/\{n\}/g, d);
  toast(`💥 ${STEPS[st].icon} ${line} (−${fmt(cost)} Kč) · vznikla podzakázka na přepracování`, true);
}
/* Dokončené podzakázky předají náklady hlavní zakázce; hotové hlavní zakázky se vyplatí. */
function settle() {
  for (const sb of G.active.filter(x => x.sub && x.done)) {
    G.active = G.active.filter(x => x !== sb);
    const par = G.active.find(x => x.id === sb.parent);
    if (!par) continue;
    par.subs = Math.max(0, (par.subs || 1) - 1);
    par.wageCost = (par.wageCost || 0) + (sb.wageCost || 0);
    par.coopCost = (par.coopCost || 0) + (sb.coopCost || 0);
    if (par.lineDone && !par.subs) par.done = true;
  }
  for (const o of G.active.filter(x => x.done && !x.sub)) finishOrder(o);
}
function applyWork(o, amt, defect) {
  const need = o.cw - o.prog;
  if (amt >= need) {
    finishStep(o, defect == null ? DEFECT_BASE[0] : defect);
    return amt - need;
  }
  o.prog += amt;
  return 0;
}

/* Dispečer: vybere nejlepší zakázku podle pravidel hráče. */
function dispatchPick() {
  const d = G.disp;
  let best = null, bs = -Infinity;
  for (const o of G.orders) {
    const n = PROD[o.pid].steps.length;
    if ((n === 1 && !d.svc) || (n >= 2 && n <= 3 && !d.mid) || (n >= 4 && !d.big)) continue;
    const need = needSteps(o);
    if (need.length && d.coop === 'never') continue;
    const plan = {};
    for (const st of need) plan[st] = d.coop === 'never' ? 'norm' : d.coop;
    if (!canPayMaterial(orderCost(o))) continue;
    const ev = evalOrder(o, plan);
    if (ev.profit <= 0 || ev.profit / o.reward * 100 < d.margin) continue;
    if (d.safe && ev.time > o.deadline * 0.9) continue;
    const score = d.prio === 'profit' ? ev.profit
      : d.prio === 'rate' ? ev.profit / Math.max(10, ev.time)
      : d.prio === 'margin' ? ev.profit / o.reward
      : (1 - need.length / n) * 1e6 + ev.profit;
    if (score > bs) { bs = score; best = { o, plan }; }
  }
  return best;
}
function autoAccept() {
  if (!G.staff.dispatcher || mainCount() >= slots()) return;
  const pick = dispatchPick();
  if (pick && acceptOrder(pick.o, pick.plan)) toast(`🧑‍💼 Dispečer přijal: ${PROD[pick.o.pid].name} ×${pick.o.qty}`);
}

/* Skladník: hromadný nákup materiálu se slevou do zásoby. */
function buyStock(spend) {
  if (!storeOn()) return 0;
  const disc = STORE_DISC[G.staff.storekeeper.tier];
  spend = Math.min(spend, G.money, (stockCap() - G.stock) * (1 - disc));
  if (spend < 1) return 0;
  G.money -= spend;
  G.stock = Math.min(stockCap(), G.stock + spend / (1 - disc));
  return spend;
}
function autoRestock() {
  if (!G.autoStock || !storeOn()) return;
  const target = stockCap() * G.autoStock;
  if (G.stock >= target * 0.5) return;
  const disc = STORE_DISC[G.staff.storekeeper.tier];
  buyStock(Math.min((target - G.stock) * (1 - disc), G.money * 0.5));
}

/* ===================== HERNÍ SMYČKA ===================== */
function tick(dt, offline) {
  G.playTime += dt;

  // kooperace: dodavatel pracuje na kroku za nás (běží i offline)
  for (const o of G.active) {
    if (!o.coop) continue;
    o.coop.left -= dt;
    if (o.coop.left <= 0) { const opt = o.coop.opt; o.coop = null; finishStep(o, COOP_DEFECT[opt] || 0.02); }
  }
  autoCoop();

  // výroba: každá stanice (stroj + člověk) zpracovává jednu zakázku, nejstarší dostanou nejrychlejší
  for (const st of STEP_ORDER) {
    const sts = stationList(st);
    if (!sts.length) continue;
    const queue = G.active.filter(o => !o.coop && !o.done && o.steps[o.step] === st).sort((a, b) => (b.sub ? 1 : 0) - (a.sub ? 1 : 0));   // přepracování má přednost
    const k = Math.min(sts.length, queue.length);
    for (let i = 0; i < k; i++) {
      const o = queue[i], s = sts[i];
      const need = o.cw - o.prog;
      const used = Math.min(dt, need / s.rate);
      o.wageCost = (o.wageCost || 0) + used * s.wage;
      applyWork(o, used * s.rate >= need ? need : used * s.rate, s.defect);
    }
  }

  // režie: mzdy personálu mimo výrobu se rozpočítají do rozpracovaných zakázek
  const ow = staffWagePerSec();
  if (ow > 0 && mainCount()) {
    const share = ow * dt / mainCount();
    for (const o of G.active) if (!o.sub) o.wageCost = (o.wageCost || 0) + share;
  }
  settle();

  // termíny běží jen při aktivní hře (offline jsou zmrazené)
  if (!offline) {
    for (const o of G.active.slice()) {
      if (o.sub) continue;
      o.left -= dt;
      if (o.left <= 0) failOrder(o);
    }
  }

  if (G.staff.dispatcher) {
    G.dispTimer += dt;
    const iv = DISP_INT[G.staff.dispatcher.tier];
    while (G.dispTimer >= iv) { G.dispTimer -= iv; autoAccept(); }
  } else G.dispTimer = 0;

  G.stockTimer += dt;
  while (G.stockTimer >= 10) { G.stockTimer -= 10; autoRestock(); }

  G.spawnTimer += dt;
  const iv = spawnInterval();
  while (G.spawnTimer >= iv) { G.spawnTimer -= iv; spawnOrder(); }
}

function offlineSim(dt) {
  dt = Math.min(dt, OFFLINE_CAP);
  const before = G.money;
  const n = Math.min(3000, Math.ceil(dt));
  const h = dt / n;
  quiet = true;
  for (let i = 0; i < n; i++) tick(h, true);
  quiet = false;
  const gain = G.money - before;
  if (dt >= 30) toast(`💤 Za ${fmtDur(dt)} nepřítomnosti: ${gain >= 0 ? '+' : ''}${fmt(gain)} Kč`);
}

function frame() {
  if (!G) return;
  const now = Date.now();
  let dt = (now - G.last) / 1000;
  G.last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 5) offlineSim(dt); else tick(dt, false);
  modalCheck();
  renderHeader();
  renderView(false);
}

function panelSig() {

}

const canManual = o => !o.coop && !o.done && !!o.steps[o.step] && machineUnits(o.steps[o.step]) > 0 && !isPending(o);
const chips = steps => steps.map(s => `<span class="chip">${STEPS[s].icon} ${STEPS[s].name}</span>`).join('');

/* --- Zakázky --- */
function dispatcherCard() {

    <button class="btn ghost" data-act="dispopen">Pravidla</button></div>`;
}
function buildOrders() {

function updateOrders() {

}

/* --- Výroba --- */
function buildProd() {
  let h = `<div class="hint" data-rates></div>`;
  if (!G.active.length) h += `<div class="empty">Žádná rozpracovaná zakázka.<br>Vyberte nějakou v záložce Zakázky.</div>`;

      <div class="row"><b>${o.sub ? '🔁 Přepracování: ' : ''}${p.icon} ${p.name}</b><span class="tag">×${o.qty}</span></div>
      <div class="chips">${o.steps.map((s, i) => `<span class="chip" data-i="${i}">${STEPS[s].icon} ${STEPS[s].name}</span>`).join('')}</div>

function updateProd() {
  const r = view.querySelector('[data-rates]');
  if (r) {
    const parts = STEP_ORDER.filter(s => stationCount(s) > 0).map(s => `${STEPS[s].icon} ${stationCount(s)}× (${stepRate(s).toFixed(1)}/s)`);
    r.innerHTML = `Ruční práce: <b>+${clickPower()}</b> za klepnutí` + (parts.length ? ` · Stanice: <b>${parts.join(' · ')}</b>` : ' · žádná obsazená stanice, najměte lidi');
  }
  view.querySelectorAll('[data-aid]').forEach(card => {
    const o = G.active.find(x => x.id == card.dataset.aid);
    if (!o) return;
    const bar = card.querySelector('[data-bar]');
    const st = o.steps[o.step];
    const pct = o.coop ? Math.min(100, (1 - o.coop.left / o.coop.total) * 100)
                       : Math.min(100, o.prog / o.cw * 100);
    bar.style.width = pct + '%';
    const redo = o.redoTo >= 0 || o.sub ? '🔁 ' : '';
    let label;
    if (!st && o.lineDone && o.subs) label = `⏳ Čeká na přepracování (${G.active.filter(x => x.parent === o.id).reduce((n, x) => n + x.qty, 0)} ks)`;
    else if (!st) label = 'Hotovo';
    else if (o.coop) label = `${redo}🤝 ${STEPS[st].name} u dodavatele: ${fmtTime(o.coop.left)}`;
    else if (isPending(o)) label = `${redo}${STEPS[st].name}: čeká na kooperaci`;
    else {
      const sc = stationCount(st);
      const idx = G.active.filter(x => !x.coop && !x.done && x.steps[x.step] === st).sort((a, b) => (b.sub ? 1 : 0) - (a.sub ? 1 : 0)).indexOf(o);
      label = sc === 0 ? `${redo}${STEPS[st].name}: ruční práce – ${Math.floor(pct)} %`
        : idx < sc ? `${redo}${STEPS[st].name}: ${Math.floor(pct)} %`
        : `${redo}${STEPS[st].name}: čeká na volnou stanici (${Math.floor(pct)} %)`;
    }
    const pctEl = card.querySelector('[data-pct]');
    if (pctEl.textContent !== label) pctEl.textContent = label;
    const par = o.sub ? G.active.find(x => x.id === o.parent) : null;
    card.querySelector('[data-left]').textContent = fmtTime(par ? par.left : o.left);
    const sEl = card.querySelector('[data-scrap]');
    const sTxt = o.sub ? 'Zmetky z hlavní zakázky se dělají znovu od začátku, hlavní zakázka na ně počká.'
      : o.scrap ? `⚠ Zmetků ${o.scrap} ks (−${fmt(o.scrapCost)} Kč za materiál)` + (o.redoTo >= 0 ? ` · přepracování ${o.pieces} ks` : '') : '';
    if (sEl.textContent !== sTxt) sEl.textContent = sTxt;
    const mb = card.querySelector('[data-main]');
    let act, txt, dis = false;
    if (o.coop) { act = 'none'; txt = '🤝 Kooperace běží…'; dis = true; }
    else if (isPending(o)) { act = 'none'; txt = '🤝 Předávám dodavateli…'; dis = true; }
    else if (canManual(o)) { act = 'work'; txt = `⚒ Pracovat sám (+${clickPower()})`; }
    else if (o.lineDone && o.subs) { act = 'none'; txt = '⏳ Čeká na přepracování'; dis = true; }
    else { act = 'none'; txt = 'Hotovo'; dis = true; }
    if (mb.dataset.act !== act) mb.dataset.act = act;
    if (mb.textContent !== txt) mb.textContent = txt;
    mb.disabled = dis;
    card.querySelectorAll('.chip').forEach(c => {
      const i = +c.dataset.i;
      c.className = 'chip' + (i < o.step ? ' done' : i === o.step ? ' cur' : '');
    });
  });
}

  const note = view.querySelector('[data-wnote]');
  let t = '';
  if (G.wh > 0 && !G.staff.storekeeper) t = '⚠ Chybí skladník: nikdo nepřijme zboží (najměte ho v záložce Lidé).';
  else if (storeOn()) t = `Skladník ${esc(G.staff.storekeeper.name)}: sleva ${pct0(STORE_DISC[G.staff.storekeeper.tier])} % při nákupu, výroba +${pct0(STORE_BONUS[G.staff.storekeeper.tier])} %.`;
  if (note.textContent !== t) note.textContent = t;
  const nw = WAREHOUSES[G.wh + 1], wb = view.querySelector('[data-act="whup"]');
  if (wb && nw) {
    const low = G.rep < nw.rep, noSpace = spaceFree() < nw.area - w.area;
    const tx = low ? `Potřeba ⭐ ${nw.rep}` : noSpace ? 'Není místo v hale' : `${G.wh ? 'Rozšířit' : 'Postavit'} za ${fmt(nw.cost)} Kč`;
    if (wb.textContent !== tx) wb.textContent = tx;
    wb.disabled = low || noSpace || G.money < nw.cost;
  }
  view.querySelectorAll('[data-act="stockbuy"]').forEach(b => {
    const full = G.stock >= w.cap - 1;
    const min = b.dataset.amt === 'max' ? 1 : +b.dataset.amt;
    b.disabled = !storeOn() || full || G.money < Math.min(min, 1e9);
  });
}

/* --- Vylepšení --- */
function buildUpgrades() {
  return UPGRADES.map(u => `<div class="card slim" data-uid="${u.id}">
    <div><b>${u.name}</b><div class="small">${u.desc}</div>
      <div class="small">Úroveň <b data-lv></b> / ${u.max}</div></div>
    <button class="btn" data-act="upg" data-id="${u.id}"></button>
  </div>`).join('');
}
function updateUpgrades() {
  view.querySelectorAll('[data-uid]').forEach(card => {
    const u = UPGRADES.find(x => x.id === card.dataset.uid);
    const lv = G.upg[u.id] || 0;
    card.querySelector('[data-lv]').textContent = lv;
    const b = card.querySelector('[data-act="upg"]');
    if (lv >= u.max) { b.textContent = 'Max'; b.disabled = true; return; }
    const c = u.cost(lv);
    b.textContent = `${fmt(c)} Kč`;
    b.disabled = G.money < c;
  });
}

/* --- Více --- */
function buildMore() {
  return `
  <div class="card"><h3>Vaše dílna</h3>
    <div class="small">${esc(G.name)} · ${START.icon} ${START.name}<br>Bonus: ${START.perkText}</div>
  </div>
  <div class="card"><h3>🤝 Trh mezi hráči</h3>
    <div class="small">Připravujeme: hráči budou vyrábět a prodávat si navzájem materiál a nástroje levněji než na běžném trhu.
    Databáze je navržená v souboru <b>supabase-schema.sql</b>.</div>
    <button class="btn full ghost" disabled>Otevřít trh (brzy)</button>
  </div>
  <div class="card"><h3>👤 Účet a cloudové ukládání</h3>
    <div class="small">Zatím se postup ukládá jen v tomto prohlížeči. Přihlášení přibude s připojením Supabase.</div>
    <button class="btn full ghost" disabled>Přihlásit se (brzy)</button>
  </div>
  <div class="card"><h3>💾 Záloha postupu</h3>
    <div class="small">Přenos mezi zařízeními: exportujte text a vložte ho do hry na jiném zařízení.</div>
    <textarea id="saveBox" placeholder="Sem vložte kód uložené hry…"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" data-act="export">Exportovat</button>
      <button class="btn ghost" data-act="import">Importovat</button>
      <button class="btn danger" data-act="reset">Nová hra</button>
    </div>
  </div>
  <div class="card"><h3>🖼️ Obrázky strojů</h3>
    <div class="small">Hra hledá soubory ve složce <b>Grafika Stroje</b> vedle index.html. Kontrola ukáže, které se našly.</div>
    <button class="btn ghost full" data-act="imgcheck">Zkontrolovat obrázky</button>
    <div class="small" data-imgres style="margin-top:8px"></div></div>
  <div class="card"><h3>🧪 Testování</h3>
    <div class="small">Pomůcky pro zkoušení hry (později je můžeme odebrat).</div>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" data-act="cheatmoney">+10 000 Kč</button>
      <button class="btn ghost" data-act="cheatrep">+25 ⭐</button>
      <button class="btn ghost" data-act="cheattech">Všechny technologie</button>
      <button class="btn ghost" data-act="cheathall">Největší hala</button>
    </div>
  </div>`;
}
function updateMore() {
  const s = view.querySelector('[data-stats]');
  if (s) s.innerHTML =
    `Dokončené zakázky: <b>${G.done}</b><br>Propadlé zakázky: <b>${G.failed}</b><br>` +
    `Celkem vyděláno: <b>${fmt(G.totalEarned)} Kč</b><br>Čas hry: <b>${fmtDur(G.playTime)}</b>`;
}

/* ===================== AKCE ===================== */
view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || !G) return;
  const act = b.dataset.act, id = b.dataset.id;

  if (act === 'accept') {
    const o = G.orders.find(x => x.id == id);
    if (!o) return;
    if (needSteps(o).length) openPlan(o.id);       // nejdřív zvolit kooperace
    else if (acceptOrder(o)) { toast('📥 Zakázka přijata'); renderView(true); renderHeader(); }
  } else if (act === 'work') {
    const o = G.active.find(x => x.id == id);
    if (o && canManual(o)) { applyWork(o, clickPower()); settle(); renderView(false); renderHeader(); }
  } else if (act === 'hire') {
    const tier = b.dataset.tier, c = hireCost(tier);
    if (WORKER[tier] && G.money >= c) {
      G.money -= c;
      const bm = bestMachineForHire();
      const w = { id: G.nextWorkerId++, name: randName(), tier, mid: bm ? bm.mid : null, site: bm ? bm.site : 0 };
      G.workers.push(w);
      toast(w.mid ? `${WORKER[tier].icon} ${w.name} nastoupil na stroj: ${MACH[w.mid].name}${G.sites.length > 1 ? ' (' + G.sites[w.site].name + ')' : ''}`
                  : `${WORKER[tier].icon} ${w.name} nastoupil (zatím bez stroje)`);
      renderView(true); renderHeader();
    }
  } else if (act === 'fire') {
    const w = G.workers.find(x => x.id == id);
    if (w) askConfirm(`Propustit zaměstnance ${w.name}?`, 'Propustit', () => { G.workers = G.workers.filter(x => x !== w); renderView(true); });
  } else if (act === 'gridview') {
    hallView = hallView === 'scene' ? 'grid' : 'scene'; rebuildHall();
  } else if (act === 'gridedit') {
    gridEdit = !gridEdit; if (!gridEdit) gridSel = null; rebuildHall();
  } else if (act === 'gridauto') {
    G.layout = {}; gridSel = null; rebuildHall();
  } else if (act === 'gridrot') {
    moveSel(null);
  } else if (act === 'gridcell') {
    if (gridEdit && gridSel) {
      const r = b.getBoundingClientRect(), c = r.width / HALLS[G.hall].w;
      moveSel({ cx: Math.floor((e.clientX - r.left) / c), cy: Math.floor((e.clientY - r.top) / c) });
    }
  } else if (act === 'gridsel') {
    gridSel = b.dataset.key || null;
    view.querySelectorAll('.mt.sel,.sm.sel,polygon.sel').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    view.querySelectorAll('polygon[data-pk]').forEach(x => { if (x.dataset.pk === gridSel) x.classList.add('sel'); });
    const gi = view.querySelector('[data-ginfo]');
    if (gi) gi.innerHTML = gridInfo(b);
  } else if (act === 'gridzoom') {
    const g = view.querySelector('.hgrid');
    const cur = g ? parseFloat(getComputedStyle(g).getPropertyValue('--c')) || 24 : 24;
    gridCell = Math.min(60, Math.max(12, Math.round(cur) + 4 * (+b.dataset.d)));
    if (g) g.style.setProperty('--c', gridCell + 'px');
  } else if (act === 'dispopen') {
    openDispatcher();
  } else if (act === 'staff-hire') {
    const role = b.dataset.role, t = b.dataset.tier;
    if (STAFF[role] && STAFF_PAY[t] && !G.staff[role] && G.money >= STAFF_PAY[t].hire && !(role === 'storekeeper' && G.wh === 0) && G.office >= staffNeed(role, t)) {
      G.money -= STAFF_PAY[t].hire;
      G.staff[role] = { name: randName(), tier: t };
      toast(`${STAFF[role].icon} ${G.staff[role].name} nastoupil jako ${STAFF[role].name.toLowerCase()}`);
      renderView(true); renderHeader();
    }
  } else if (act === 'staff-fire') {
    const role = b.dataset.role, st = G.staff[role];
    if (st) askConfirm(`Propustit: ${STAFF[role].name} ${st.name}?`, 'Propustit', () => { G.staff[role] = null; renderView(true); });
  } else if (act === 'stockbuy') {
    const amt = b.dataset.amt === 'max' ? 1e12 : +b.dataset.amt;
    if (buyStock(amt) > 0) { renderView(false); renderHeader(); }
  } else if (act === 'site') {
    G.cs = Math.min(G.sites.length - 1, Math.max(0, +b.dataset.i)); gridSel = null; renderView(true);
  } else if (act === 'siteadd') {
    openSiteBuy();
  } else if (act === 'ofup') {
    const n = OFFICES[G.office + 1];
    if (n && G.rep >= n.rep && G.money >= n.cost && spaceFree() >= n.area - OFFICES[G.office].area) {
      G.money -= n.cost; G.office++;
      toast(`🗂️ Nová kancelář: ${n.name}`);
      renderView(true); renderHeader();
    }
  } else if (act === 'whup') {
    const nw = WAREHOUSES[G.wh + 1];
    if (nw && G.rep >= nw.rep && G.money >= nw.cost && spaceFree() >= nw.area - WAREHOUSES[G.wh].area) {
      G.money -= nw.cost; G.wh++;
      toast(`📦 Nový sklad: ${nw.name}`);
      renderView(true); renderHeader();
    }
  } else if (act === 'tech') {
    const nt = nextTech(), st = b.dataset.step;
    if (nt && STEPS[st] && STEPS[st].ind === siteInd() && !G.techs[st] && G.rep >= nt.rep && G.money >= nt.cost) {
      G.money -= nt.cost; G.techs[st] = true;
      toast(`🏢 Firma se rozšířila o technologii: ${STEPS[st].name}`);
      renderView(true); renderHeader();
    }
  } else if (act === 'buy') {
    const m = MACH[id], c = machineCost(m);
    if (G.techs[m.step] && G.money >= c && spaceFree() >= FOOTPRINT[m.tier]) {
      G.money -= c; G.machines[id] = (G.machines[id] || 0) + 1;
      const free = bestWorkerWithoutMachine();
      if (free) { free.mid = id; free.site = G.cs; }   // volný pracovník rovnou nastoupí na nový stroj
      renderView(false); renderHeader();
    } else if (spaceFree() < FOOTPRINT[m.tier]) toast('Hala je plná – rozšiřte sídlo v záložce Firma', true);
  } else if (act === 'sell') {
    const m = MACH[id];
    if (m && G.machines[id] > 0) {
      askConfirm(`Prodat stroj ${m.name} za ${fmt(sellValue(m))} Kč?`, 'Prodat', () => {
        if (!(G.machines[id] > 0)) return;
        G.money += sellValue(m); G.machines[id]--;
        if (G.machines[id] <= 0) delete G.machines[id];
        fixAssignments(G); renderView(true); renderHeader();
      });
    }
  } else if (act === 'hall') {
    const nh = HALLS[G.hall + 1];
    if (nh && G.rep >= nh.rep && G.money >= nh.cost) {
      G.money -= nh.cost; G.hall++;
      toast(`🏢 Nové sídlo: ${nh.name} (${nh.area} m²)`);
      renderView(true); renderHeader();
    }
  } else if (act === 'upg') {
    const u = UPGRADES.find(x => x.id === id), lv = G.upg[id] || 0;
    if (lv < u.max && G.money >= u.cost(lv)) { G.money -= u.cost(lv); G.upg[id] = lv + 1; renderView(false); renderHeader(); }
  } else if (act === 'export') {
    save();
    $('#saveBox').value = btoa(unescape(encodeURIComponent(JSON.stringify(G))));
  } else if (act === 'import') {
    try {
      const raw = $('#saveBox').value.trim();
      const s = sanitize(JSON.parse(decodeURIComponent(escape(atob(raw)))));
      if (!s) throw new Error('bad');
      askConfirm('Přepsat aktuální postup importovaným?', 'Přepsat', () => {
        G = s; START = STARTS[G.start]; G.last = Date.now(); fillBoard(); save();
        renderHeader(); renderView(true); toast('Postup načten');
      });
    } catch (err) { toast('Import se nepovedl – zkontrolujte kód', true); }
  } else if (act === 'reset') {
    askConfirm('Opravdu začít novou hru? Veškerý postup se smaže.', 'Začít novou hru', () => {
      G = null; START = null;                       // aby ho pagehide/interval znovu neuložil
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      curTab = 'orders'; viewSig = ''; markTab();
      view.innerHTML = '';
      showStart();
    });
  } else if (act === 'cheatmoney') {
    G.money += 10000; renderHeader(); renderView(false);
  } else if (act === 'cheatrep') {
    G.rep += 25; renderHeader(); renderView(false);
  } else if (act === 'cheattech') {
    for (const st of stepsOf(siteInd())) G.techs[st] = true;
    renderView(true);
  } else if (act === 'imgcheck') {
    const out = view.querySelector('[data-imgres]');
    out.textContent = 'Zkouším…';
    const tryLoad = u => new Promise(r => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = u; });
    (async () => {
      let ok = 0; const miss = [];
      for (const m of MACHINES) {
        let found = false;
        for (const c of imgCandidates(m)) if (await tryLoad(c)) { found = true; break; }
        if (found) ok++; else miss.push(m.name);
      }
      const base = new URL(imgCandidates(MACHINES[0])[0], document.baseURI).href;
      out.innerHTML = `Nalezeno <b>${ok} / ${MACHINES.length}</b>.` + (miss.length ? `<br>Chybí: ${miss.map(esc).join(', ')}` : '') +
        `<br>Stránka běží na: <b>${esc(location.protocol + '//' + (location.host || '(soubor)'))}</b><br>Příklad hledané adresy: ${esc(base)}` +
        (location.protocol === 'file:' ? '<br>⚠ Stránka je otevřená ze souboru, obrázky se načtou jen když jsou vedle něj.' : '');
      Object.keys(IMG).forEach(k => delete IMG[k]);
    })();
  } else if (act === 'cheathall') {
    G.hall = HALLS.length - 1; renderView(true);
  }
});
function openDispatcher() {
  const d = G.disp;
  const opts = (map, cur) => Object.entries(map).map(([k, v]) => `<option value="${k}"${cur === k ? ' selected' : ''}>${v}</option>`).join('');
  $('#modal').hidden = false;
  $('#modal').innerHTML = `<div class="mbox">
    <h3>🧑‍💼 Pravidla dispečera</h3>
    <div class="small">Dispečer přijímá zakázky jen podle těchto pravidel, i když jste pryč.</div>
    <label class="small">Priorita<select data-disp="prio">${opts(PRIO_NAMES, d.prio)}</select></label>
    <label class="small">Minimální marže (podíl zisku z odměny)<select data-disp="margin">${[0, 10, 20, 30, 40, 50]
      .map(v => `<option value="${v}"${d.margin === v ? ' selected' : ''}>${v} %</option>`).join('')}</select></label>
    <label class="small">Kooperace<select data-disp="coop">${opts(COOP_POLICY, d.coop)}</select></label>
    <div class="small" style="margin-top:12px">Typy zakázek</div>
    <label class="chk"><input type="checkbox" data-disp="svc"${d.svc ? ' checked' : ''}> Zakázkové práce (1 operace)</label>
    <label class="chk"><input type="checkbox" data-disp="mid"${d.mid ? ' checked' : ''}> Jednodušší výrobky (2–3 operace)</label>
    <label class="chk"><input type="checkbox" data-disp="big"${d.big ? ' checked' : ''}> Složité výrobky (4 a víc operací)</label>
    <label class="chk"><input type="checkbox" data-disp="safe"${d.safe ? ' checked' : ''}> Jen zakázky, které stihnu v termínu</label>
    <button class="btn full" data-act="coopclose">Hotovo</button>
  </div>`;
}
$('#modal').addEventListener('change', e => {
  const el = e.target.closest('[data-disp]');
  if (!el || !G) return;
  const k = el.dataset.disp;
  if (el.type === 'checkbox') G.disp[k] = el.checked;
  else if (k === 'margin') G.disp[k] = +el.value;
  else G.disp[k] = el.value;
  if (curTab === 'orders') renderView(true);
});
view.addEventListener('change', e => {
  const as = e.target.closest('select[data-autostock]');
  if (as && G) { G.autoStock = +as.value; return; }
  const sel = e.target.closest('select[data-assign]');
  if (!sel || !G) return;
  const w = G.workers.find(x => x.id == sel.dataset.assign);
  if (!w) return;
  const [si, mid] = sel.value.split('|'), site = G.sites[+si];
  if (!mid) { w.mid = null; }
  else if (site && MACH[mid] && site.techs[MACH[mid].step] && freeSlots(mid, w.id, site.id) > 0) { w.mid = mid; w.site = site.id; }
  renderView(true);
});
$('#modal').addEventListener('click', e => {
  if (!G) return;
  if (e.target === $('#modal')) { closeCoop(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'sitebuy') {
    const n = G.sites.length, st = b.dataset.step;
    if (n - 1 < SITE_MAX && STEPS[st] && !G.sites.some(x => x.spec === st) && G.rep >= SITE_REP(n) && G.money >= SITE_COST(n)) {
      G.money -= SITE_COST(n);
      G.sites.push(mkSite(n, 'Středisko: ' + STEPS[st].name, st, {}, { [st]: true }, STEPS[st].ind));
      G.cs = n; gridSel = null;
      toast(`🏭 Nové středisko: ${STEPS[st].name}`);
      closeCoop(); renderView(true); renderHeader();
    }
  } else if (act === 'coopclose') {
    closeCoop();
  } else if (act === 'confyes') {
    const cb = confirmCb; closeCoop();
    if (cb) cb();
  } else if (act === 'plan') {
    planSel[b.dataset.step] = b.dataset.opt;
    buildModal();
  } else if (act === 'planok') {
    const o = G.orders.find(x => x.id == planOid);
    if (o && acceptOrder(o, Object.assign({}, planSel))) {
      toast('📥 Zakázka přijata'); closeCoop(); renderView(true); renderHeader();
    } else {
      toast('Zakázku nelze přijmout (plná dílna nebo chybí peníze)', true);
    }
  }
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b || !G) return;
  curTab = b.dataset.tab; markTab(); renderView(true);
});

/* ===================== START ===================== */
function showStart() {
  const el = $('#start');
  el.hidden = false;
  el.innerHTML = `<div class="start-box">
    <h1>🏭 Plechárna</h1>
    <p class="small">Idle hra o výrobě a servisu. Z malé dílny postavíte firmu s více středisky a obory.</p>
    <label class="small">Název vaší firmy
      <input type="text" id="nameInput" maxlength="24" placeholder="Např. Dílna Novák"></label>
    <h3>Čím chcete začít?</h3>
    ${Object.entries(INDUSTRIES).map(([ind, d]) => `<h3 style="margin:16px 0 4px">${d.icon} ${d.name}</h3><div class="small">${d.desc}</div>` +
      Object.entries(STARTS).filter(([, x]) => (x.ind || 'metal') === ind).map(([id, x]) => `
      <button class="card pick" data-start="${id}">
        <b>${x.icon} ${x.name}</b><span>${x.desc}</span>
        <em>${x.perkText} · start ${x.money} Kč</em>
      </button>`).join('')).join('')}
  </div>`;
}
$('#start').addEventListener('click', e => {
  const b = e.target.closest('[data-start]');
  if (!b) return;
  const name = ($('#nameInput').value || '').trim().slice(0, 24);
  G = newState(b.dataset.start, name);
  START = STARTS[G.start];
  fillBoard();
  $('#start').hidden = true;
  save(); renderHeader(); renderView(true);
});

function init() {
  buildTabs();
  G = load();
  if (G) {
    START = STARTS[G.start];
    fillBoard();
    renderHeader(); renderView(true);
    frame();               // dopočítá offline postup
  } else {
    showStart();
  }
  setInterval(frame, 200);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else frame(); });
  window.addEventListener('pagehide', save);
}
init();
</script>
</body>
</html>
